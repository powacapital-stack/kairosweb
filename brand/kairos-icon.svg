<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#121830"/>
      <stop offset="0.55" stop-color="#090a0f"/>
      <stop offset="1" stop-color="#030409"/>
    </radialGradient>
    <radialGradient id="glowC" cx="30%" cy="25%" r="55%">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="75%" cy="80%" r="55%">
      <stop offset="0" stop-color="#7000ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7000ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f0ff"/>
      
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#8b5cff" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <rect width="1024" height="1024" fill="url(#glowC)"/>
  <rect width="1024" height="1024" fill="url(#glowV)"/>

  <!-- Símbolo: marco redondeado + K de Kairos (escalado del logo de la web, 32 → 480 px) -->
  <g transform="translate(272 272) scale(15)" filter="url(#neon)" fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="1.5" width="29" height="29" rx="8" stroke-width="1.6"/>
    <path d="M10 23V9M10 16l11-7M13.5 14l8.5 10" stroke-width="2.4"/>
  </g>
</svg>
